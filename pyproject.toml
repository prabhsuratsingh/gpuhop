[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuhop"
version = "0.1.0"
description = "Run experiments on rented cloud GPUs from your laptop: up -> setup -> run jobs -> pull results/logs/videos -> destroy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "vastai>=1.8.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
gpuhop = "gpuhop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpuhop = ["gpus.yaml", "runtime/*", "templates/**/*", "templates/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
